name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.filter.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_e2e=false
          while IFS= read -r path; do
            case "$path" in
              docs/*|changes/*) ;;
              */*) run_e2e=true ;;
              roadmap.*|*.md) ;;
              *) run_e2e=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "run_e2e=$run_e2e" >> "$GITHUB_OUTPUT"

  e2e:
    needs: changes
    if: needs.changes.outputs.run_e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: lifecycle
            files: [tests/e2e/test_lifecycle.py]
          - name: lifecycle_resume
            files: [tests/e2e/test_lifecycle_resume.py]
          - name: harbor_contract
            files:
              - tests/e2e/test_harbor_contract.py
              - tests/e2e/test_machine_check.py
              - tests/e2e/test_service_lifetime.py
          - name: upstream_and_refusals
            files:
              - tests/e2e/test_upstream_and_refusals.py
              - tests/e2e/test_how_to_commands.py
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: e2e (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, version: "0.12.13" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: uv sync --all-extras --locked
      - run: uv run pytest -p no:cacheprovider --durations=0 ${{ join(matrix.shard.files, ' ') }}

  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, version: "0.12.13" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: uv sync --all-extras --locked
      - run: uv run gate
      - run: uv run check --checks test-names,test-layout,filename-portability,secrets,untracked-paths
      - if: github.base_ref == 'dev'
        run: uv run check --checks changelog-fragment
