name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, version: "0.12.13" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: uv sync --all-extras --locked
      - run: uv run gate --only e2e

  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, version: "0.12.13" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: uv sync --all-extras --locked
      - run: scutil --proxy || true
      - run: uv run python -c "import urllib.request as u, time; t=time.monotonic(); print(u.getproxies()); print(u.proxy_bypass('127.0.0.1')); print(time.monotonic()-t)"
      - run: uv run pytest tests/integration -n 4 -o faulthandler_timeout=15 --durations=8
      - run: uv run check --checks test-names,test-layout,filename-portability,secrets,untracked-paths
      - if: github.base_ref == 'dev'
        run: uv run check --checks changelog-fragment
